<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Hi, I'm Kevin. I build AI infrastructure, autonomous agents, AI-DLC workflows and secure-by-default AI.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#0b3a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#d2a8ff"/>
      <stop offset="1" stop-color="#3fb950"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    .wave { transform-box: fill-box; transform-origin: 70% 90%; animation: wave 2.4s ease-in-out infinite; }
    @keyframes wave { 0%,60%,100% { transform: rotate(0) } 10%,30% { transform: rotate(16deg) } 20%,40% { transform: rotate(-8deg) } }
    .word { opacity: 0; animation: cycle 12s infinite; }
    .w2 { animation-delay: 3s } .w3 { animation-delay: 6s } .w4 { animation-delay: 9s }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(12px) } 4%,21% { opacity: 1; transform: translateY(0) } 25%,100% { opacity: 0; transform: translateY(-12px) } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(1.9); opacity: 0 } }
    .edge { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20 } }
    .float { animation: bob 4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .w1 { opacity: 1; }
    }
  </style>

  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="40" cy="30" r="1.4"/>
    <circle class="star" cx="130" cy="250" r="1.2" style="animation-delay:.6s"/>
    <circle class="star" cx="300" cy="22" r="1.6" style="animation-delay:1.2s"/>
    <circle class="star" cx="470" cy="255" r="1.1" style="animation-delay:.3s"/>
    <circle class="star" cx="560" cy="35" r="1.3" style="animation-delay:1.8s"/>
    <circle class="star" cx="960" cy="40" r="1.5" style="animation-delay:.9s"/>
    <circle class="star" cx="930" cy="250" r="1.2" style="animation-delay:2.2s"/>
    <circle class="star" cx="640" cy="260" r="1.4" style="animation-delay:1.5s"/>
    <circle class="star" cx="220" cy="140" r="1" style="animation-delay:2.6s"/>
  </g>

  <!-- left: greeting -->
  <g class="sans">
    <text x="56" y="92" font-size="40" font-weight="800" fill="#f0f6fc">Hi, I'm Kevin <tspan class="wave" font-size="38">👋</tspan></text>
    <text x="58" y="126" font-size="17" fill="#8b949e" class="mono">Rongji Wang · Sydney 🇦🇺 · via Wellington 🇳🇿</text>
    <text x="56" y="182" font-size="28" font-weight="700" fill="#c9d1d9">I build</text>
    <g font-size="28" font-weight="800" fill="url(#txt)">
      <text class="word w1" x="162" y="182">AI infrastructure 🏗️</text>
      <text class="word w2" x="162" y="182">autonomous agents 🤖</text>
      <text class="word w3" x="162" y="182">AI-DLC workflows 🔁</text>
      <text class="word w4" x="162" y="182">secure-by-default AI 🔐</text>
    </g>
    <text x="58" y="232" font-size="16" fill="#8b949e" class="mono">&gt; from intent to production: autonomous, secure, audited.<tspan class="caret" fill="#3fb950">▌</tspan></text>
  </g>

  <!-- right: tiny agent network -->
  <g transform="translate(760 140)">
    <circle r="110" fill="url(#glow)"/>
    <g stroke="#58a6ff" stroke-width="2" fill="none" opacity=".8">
      <path id="e1" class="edge" d="M0 0 L-90 -60"/>
      <path id="e2" class="edge" d="M0 0 L95 -55"/>
      <path id="e3" class="edge" d="M0 0 L-85 70"/>
      <path id="e4" class="edge" d="M0 0 L100 65"/>
    </g>
    <!-- packets -->
    <g fill="#3fb950">
      <circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M0 0 L-90 -60"/></circle>
      <circle r="4"><animateMotion dur="2.6s" begin=".5s" repeatCount="indefinite" path="M95 -55 L0 0"/></circle>
      <circle r="4" fill="#d2a8ff"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M0 0 L-85 70"/></circle>
      <circle r="4" fill="#d2a8ff"><animateMotion dur="2.4s" begin=".2s" repeatCount="indefinite" path="M100 65 L0 0"/></circle>
    </g>
    <g class="sans" font-size="26" text-anchor="middle" dominant-baseline="central">
      <circle class="pulse" r="30" fill="#a371f7"/>
      <circle r="30" fill="#21262d" stroke="#a371f7" stroke-width="2.5"/>
      <text y="1" class="float">🧠</text>
      <g transform="translate(-90 -60)"><circle r="22" fill="#21262d" stroke="#58a6ff" stroke-width="2"/><text y="1">🤖</text></g>
      <g transform="translate(95 -55)"><circle r="22" fill="#21262d" stroke="#58a6ff" stroke-width="2"/><text y="1">☁️</text></g>
      <g transform="translate(-85 70)"><circle r="22" fill="#21262d" stroke="#58a6ff" stroke-width="2"/><text y="1">🔐</text></g>
      <g transform="translate(100 65)"><circle r="22" fill="#21262d" stroke="#58a6ff" stroke-width="2"/><text y="1">🧑‍💻</text></g>
    </g>
  </g>
</svg>
